version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: medrecord_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medadmin
      POSTGRES_PASSWORD: medpassword123
      POSTGRES_DB: medical_records_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
